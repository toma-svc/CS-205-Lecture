<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Assignment Tracker</title>
    <script src="scripts.js"></script>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <header>
        <h1>Student Assignment Tracker</h1>
    </header>
    <section>
        <div>
            <input type="text" id="assignmentInput" placeholder="Assignment Name"/>
        </div>
        <div>
            <input type="date" id="dueDateInput"/>
        </div>
        <button id="addButton">
            Add Assignment
        </button>
    </section>
    <section>
        <ul id="assignmentList"></ul>
    </section>
</body>
</html>
